# TEMPLATE ONLY. Do not put real values in this file.
#   cp secret.example.yaml secret.yaml   # secret.yaml is gitignored
#   edit secret.yaml, then: kubectl apply -f secret.yaml
# Optional tokens may be omitted entirely (they are marked optional in the pods).
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio
  labels:
    app.kubernetes.io/part-of: portfolio
type: Opaque
stringData:
  # PostgreSQL. DATABASE_URL must use the same user/password/db; the host is the postgres Service.
  POSTGRES_USER: "portfolio"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "portofolio_db"
  DATABASE_URL: "postgres://portfolio:CHANGE_ME@postgres:5432/portofolio_db?sslmode=disable"

  # GitHub OAuth app (single admin).
  GITHUB_CLIENT_ID: "CHANGE_ME"
  GITHUB_CLIENT_SECRET: "CHANGE_ME"
  ADMIN_GITHUB_ID: "123456"

  # Optional tokens, min 32 chars each: openssl rand -hex 32
  CI_BENCHMARK_TOKEN: "CHANGE_ME_openssl_rand_hex_32"
  METRICS_TOKEN: "CHANGE_ME_openssl_rand_hex_32"
  # Optional: Discord/Slack-compatible webhook for contact notifications.
  # CONTACT_WEBHOOK_URL: "https://hooks.example.com/..."

  # Cloudflare Tunnel token (Zero Trust dashboard > Networks > Tunnels > your tunnel).
  TUNNEL_TOKEN: "CHANGE_ME"

  # Backups (backup-cronjob.yaml). Keep a copy of the key OUTSIDE the cluster:
  # without it every backup is unreadable.
  BACKUP_ENCRYPTION_KEY: "CHANGE_ME_openssl_rand_hex_32"
  AZURE_STORAGE_ACCOUNT: "CHANGE_ME"
  AZURE_STORAGE_CONTAINER: "pgbackups"
  AZURE_STORAGE_SAS_TOKEN: "CHANGE_ME"
