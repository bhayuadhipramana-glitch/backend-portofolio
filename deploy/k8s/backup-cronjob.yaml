# Nightly encrypted pg_dump -> Azure Blob (Cool tier), pruned after 30 days.
# See deploy/scripts/backup_postgres_azure.sh for the pipeline and the restore command.
#   docker build -f deploy/scripts/Dockerfile.backup -t portfolio-backup:latest .
#   docker save portfolio-backup:latest | sudo k3s ctr images import -
# Smoke test now instead of waiting for 03:17 UTC:
#   kubectl -n portfolio create job --from=cronjob/postgres-backup postgres-backup-manual
#   kubectl -n portfolio logs -f job/postgres-backup-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: portfolio
  labels: {app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: portfolio}
spec:
  schedule: "17 3 * * *" # UTC, off the hour to avoid the common :00 rush
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: portfolio}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: portfolio-backup:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom: {secretKeyRef: {name: portfolio-secrets, key: DATABASE_URL}}
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom: {secretKeyRef: {name: portfolio-secrets, key: BACKUP_ENCRYPTION_KEY}}
                - name: AZURE_STORAGE_ACCOUNT
                  valueFrom: {secretKeyRef: {name: portfolio-secrets, key: AZURE_STORAGE_ACCOUNT}}
                - name: AZURE_STORAGE_CONTAINER
                  valueFrom: {secretKeyRef: {name: portfolio-secrets, key: AZURE_STORAGE_CONTAINER}}
                - name: AZURE_STORAGE_SAS_TOKEN
                  valueFrom: {secretKeyRef: {name: portfolio-secrets, key: AZURE_STORAGE_SAS_TOKEN}}
                - {name: BACKUP_RETENTION_DAYS, value: "30"}
                - {name: BACKUP_TMPDIR, value: /scratch}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: "1", memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: scratch, mountPath: /scratch}
          volumes:
            # Holds only the encrypted archive; a few MB for this database.
            - name: scratch
              emptyDir: {sizeLimit: 512Mi}
