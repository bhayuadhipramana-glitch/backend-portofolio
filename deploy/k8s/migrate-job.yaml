# Applies migrations/ before (or after) a release. The API does not migrate itself.
#   docker build --target migrate -t portfolio-migrate:latest .
#   docker save portfolio-migrate:latest | sudo k3s ctr images import -
#   kubectl -n portfolio delete job portfolio-migrate --ignore-not-found
#   kubectl apply -f deploy/k8s/migrate-job.yaml
#   kubectl -n portfolio logs job/portfolio-migrate
apiVersion: batch/v1
kind: Job
metadata:
  name: portfolio-migrate
  namespace: portfolio
  labels: {app.kubernetes.io/name: portfolio-migrate, app.kubernetes.io/part-of: portfolio}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: portfolio-migrate, app.kubernetes.io/part-of: portfolio}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: portfolio-migrate:latest
          imagePullPolicy: IfNotPresent
          args: ["-path", "/migrations", "-database", "$(DATABASE_URL)", "up"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: portfolio-secrets, key: DATABASE_URL}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
