services:
  postgres:
    image: postgres:17-alpine
    container_name: portofolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-portofolio_db}
    ports:
      # Loopback only: the database must never be reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: portofolio_valkey
    restart: unless-stopped
    # Pure cache (no persistence): bounded memory, least-recently-used eviction.
    command: ["valkey-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      # Loopback only: the cache must never be reachable from the LAN.
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: portofolio_nats
    restart: unless-stopped
    # JetStream with bounded memory/file stores (limits live in the config file,
    # because nats-server has no CLI flags for them); 8222 is the monitoring port.
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      # Loopback only: the broker must never be reachable from the LAN.
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./deploy/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - natsdata:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    driver: local
  natsdata:
    driver: local
